<header class="site-header">
  <a class="brand" href="#accueil" aria-label="Afrik Textile, accueil">
    <img src="/img/AfrikTextile.jpg" alt="" />
    <span>Afrik Textile</span>
  </a>

  <nav aria-label="Navigation principale">
    <ul class="nav-list">
      <li><a class="nav-link nav-link--active" href="#accueil" aria-current="page">Accueil</a></li>
      <li><a class="nav-link" href="#origines">Nos origines</a></li>
      <li><a class="nav-link" href="#catalogue">Catalogue</a></li>
      <li><a class="nav-link" href="#contacts">Contacts</a></li>
    </ul>
  </nav>
</header>

<main>
  <section class="hero" id="accueil" aria-labelledby="hero-title">
    <div class="hero__content">
      <p class="hero__eyebrow">L’Afrique, tissée avec passion</p>
      <h1 id="hero-title">Afrik Textile</h1>
      <p class="hero__tagline">L’authenticité africaine, notre fierté.</p>
      <p class="hero__description">
        Découvrez nos tissus traditionnels, un voyage coloré à travers l’Afrique.
      </p>
      <a class="hero__button" href="#catalogue">
        Découvrir notre collection <span aria-hidden="true">→</span>
      </a>
    </div>
    <div class="hero__visual" aria-hidden="true"></div>
  </section>

  <app-origins
    [selectedCountry]="selectedCountry()"
    (countrySelected)="selectCountry($event)"
  ></app-origins>
  <app-catalogue
    [selectedCountry]="selectedCountry()"
    (countrySelected)="selectCountry($event)"
  ></app-catalogue>
  <app-engagements></app-engagements>
  <app-contacts></app-contacts>
</main>
<app-footer></app-footer>
