<section class="origins" id="origines" aria-labelledby="origins-title">
  <div class="origins__intro">
    <h2 class="origins__title" id="origins-title">Nos origines</h2>
    <p class="origins__description">
      Explorez nos tissus par pays et découvrez leurs richesses culturelles.
    </p>
  </div>

  @if (countryError()) {
    <p class="origins__error" role="alert">{{ countryError() }}</p>
  }

  <ul class="origins__countries">
    <li>
      <app-country-pill
        name="Tous"
        description="Tous les pays"
        [primary]="true"
        [active]="selectedCountry() === null"
        (selected)="countrySelected.emit(null)"
      ></app-country-pill>
    </li>
    @for (country of countries(); track country.id) {
      <li>
        <app-country-pill
          [name]="country.name"
          [description]="country.flag"
          [flagUrl]="country.flagUrl ?? null"
          [active]="selectedCountry() === country.name"
          (selected)="countrySelected.emit($event)"
        ></app-country-pill>
      </li>
    }
  </ul>
</section>
