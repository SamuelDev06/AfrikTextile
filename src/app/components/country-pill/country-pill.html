<a
  class="country-pill"
  [class.country-pill--active]="active()"
  [class.country-pill--primary]="primary()"
  href="#catalogue"
  [attr.aria-current]="active() ? 'true' : null"
  (click)="selected.emit(name())"
>
  @if (primary()) {
    <svg class="country-pill__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
      <circle cx="12" cy="12" r="9" />
      <path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18" />
    </svg>
  } @else if (flagUrl()) {
    <img class="country-pill__flag-image" [src]="flagUrl()!" [alt]="'Drapeau de ' + name()" />
  } @else {
    <span class="country-pill__placeholder">{{ description() }}</span>
  }
  <span class="country-pill__name">{{ name() }}</span>
</a>
